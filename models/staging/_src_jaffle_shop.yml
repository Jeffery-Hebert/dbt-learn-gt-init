sources:
- name: jaffle_shop
  description: "Source data for the Jaffle Shop project. Clone of Postgres Database"
  database: raw
  tables:
  - name: customers
    description: "Raw customers table contains information about the customers of the Jaffle Shop."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: { count: 12, period: hour }
        # error_after: { count: 2, period: day }
    columns:
    - name: id
      description: "PK"
  - name: orders
    description: "Raw orders table contains information about the orders placed by customers at the Jaffle Shop."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: { count: 12, period: hour }
        # error_after: { count: 2, period: day }
  - name: payments
    description: "Raw payments table contains information about the payments made for orders at the Jaffle Shop."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: { count: 12, period: hour }
        # error_after: { count: 2, period: day }
