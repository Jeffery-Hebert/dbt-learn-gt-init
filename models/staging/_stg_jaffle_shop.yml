models:
- name: stg_jaffle_shop_customers
  description: "Staging model for the customers table from the jaffle_shop source."
  columns:
  - name: customer_id
    description: "The unique identifier for each customer."
    data_tests:
    - not_null
    - unique
  - name: first_name
    description: "The first name of the customer."
  - name: last_name
    description: "The last name of the customer."
- name: stg_jaffle_shop_orders
  description: "Staging model for the orders table from the jaffle_shop source."
  columns:
  - name: order_id
    description: "The unique identifier for each order."
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: "The identifier for the customer who placed the order."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_jaffle_shop_customers')
          field: customer_id
  - name: order_date
    description: "The date when the order was placed."
  - name: status
    description: "{{ doc('order_status') }}"
    data_tests:
    - accepted_values:
        arguments:
          values: [ 'shipped', 'return_pending', 'placed', 'completed', 'returned' ]
